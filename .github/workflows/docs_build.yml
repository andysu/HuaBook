name: Auto-Translate and RTD Webhook

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'docs/**'

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Update POT and PO files
        run: |
          cd docs
          sphinx-build -b gettext . _build/gettext
          sphinx-intl update -p _build/gettext -l en -l zh_CN

      - name: Run LLM Translator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python docs/translate_docs.py

      - name: Commit translations back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/locale/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-translate Sphinx docs via LLM" && git push)
