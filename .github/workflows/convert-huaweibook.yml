name: Convert HuaweiBook to PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/HuaweiBook.md'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-open-sans \
            fonts-dejavu \
            fonts-noto \
            ghostscript \
            chromium-browser
          pip install img2pdf --break-system-packages
          # marked: MD→HTML  |  puppeteer: HTML→PDF  (no md-to-pdf, no YAML parser)
          npm install -g marked
          npm install -g puppeteer

      # ── cover.png → cover_tmp.pdf ────────────────────────────────────────────
      - name: Convert cover.png → PDF
        run: |
          img2pdf docs/cover.png \
            --pagesize A4 \
            --fit shrink \
            -o docs/cover_tmp.pdf

      # ── MD → HTML → PDF (повністю без YAML) ─────────────────────────────────
      - name: Convert MD → PDF
        run: |
          node - <<'SCRIPT'
          const fs       = require('fs');
          const path     = require('path');
          const { execSync } = require('child_process');

          // ── 1. Розриви сторінок ────────────────────────────────────────────
          const src   = fs.readFileSync('docs/HuaweiBook.md', 'utf8');
          const lines = src.split('\n');
          const out   = [];

          for (const line of lines) {
            if (/^## /.test(line) && !/^## 📑/.test(line)) {
              out.push('<div style="page-break-before:always"></div>', '');
            }
            out.push(line);
          }
          const mdBody = out.join('\n');

          // ── 2. MD → HTML через marked CLI ─────────────────────────────────
          const tmpMd = '/tmp/_book.md';
          fs.writeFileSync(tmpMd, mdBody);
          const markedBin = execSync('npm root -g').toString().trim() + '/marked/bin/marked.js';
          const bodyHtml  = execSync(`node "${markedBin}" --input "${tmpMd}"`).toString();

          // ── 3. CSS ────────────────────────────────────────────────────────
          const css = fs.readFileSync('docs/pdf-style.css', 'utf8');

          // ── 4. Колонтитули (CSS з двокрапками — жоден YAML-парсер не бачить)
          const font =
            'font-family:Open Sans,sans-serif;font-size:9px;' +
            'color:#888;width:100%;box-sizing:border-box';

          const headerTemplate =
            `<div style="${font};padding:4px 15mm 0;border-bottom:1px solid #ddd">` +
            `Huawei SUN2000 \u2014 \u0415\u043D\u0446\u0438\u043A\u043B\u043E\u043F\u0435\u0434\u0456\u044F ` +
            `\u041B\u043E\u0433\u0456\u0432 \u0442\u0430 \u0422\u0435\u0445\u043D\u0456\u0447\u043D\u043E\u0457 ` +
            `\u0414\u0456\u0430\u0433\u043D\u043E\u0441\u0442\u0438\u043A\u0438` +
            `</div>`;

          const footerTemplate =
            `<div style="${font};padding:0 15mm 4px;text-align:right">` +
            `<span class="pageNumber"></span>&nbsp;/&nbsp;<span class="totalPages"></span>` +
            `</div>`;

          // ── 5. Повний HTML-документ ────────────────────────────────────────
          const html = `<!DOCTYPE html>
          <html><head>
            <meta charset="utf-8">
            <style>${css}</style>
          </head><body>
            ${bodyHtml}
          </body></html>`;

          const tmpHtml = '/tmp/_book.html';
          fs.writeFileSync(tmpHtml, html);

          // ── 6. Puppeteer: HTML → PDF ───────────────────────────────────────
          const puppeteerRoot = execSync('npm root -g').toString().trim();
          const { launch }    = require(puppeteerRoot + '/puppeteer');

          (async () => {
            const browser = await launch({
              executablePath: '/usr/bin/chromium-browser',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.goto('file://' + tmpHtml, { waitUntil: 'networkidle0' });
            await page.pdf({
              path: 'docs/_processed.pdf',
              format: 'A4',
              margin: { top: '28mm', bottom: '25mm', left: '15mm', right: '15mm' },
              displayHeaderFooter: true,
              headerTemplate,
              footerTemplate,
              printBackground: true
            });
            await browser.close();
            console.log('PDF written: docs/_processed.pdf');
          })();
          SCRIPT

      # ── Зливаємо обкладинку + контент через Ghostscript ─────────────────────
      - name: Merge cover + content
        run: |
          gs -dBATCH -dNOPAUSE -q \
            -sDEVICE=pdfwrite \
            -sOutputFile=docs/HuaweiBook.pdf \
            docs/cover_tmp.pdf docs/_processed.pdf

      # ── Прибираємо тимчасові файли ───────────────────────────────────────────
      - name: Cleanup
        run: rm -f docs/_processed.pdf docs/cover_tmp.pdf

      # ── Комітимо результат ───────────────────────────────────────────────────
      - name: Commit HuaweiBook.pdf
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/HuaweiBook.pdf
          git diff --staged --quiet || git commit -m "ci: auto-generate docs/HuaweiBook.pdf [skip ci]"
          git push
