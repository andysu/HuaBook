name: Convert HuaweiBook to PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/HuaweiBook.md'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto poppler-utils
          pip install img2pdf --break-system-packages
          npm install -g md-to-pdf

      # ── cover.png → cover_tmp.pdf (без втрати якості) ───────────────────────
      - name: Convert cover.png → PDF
        run: |
          img2pdf docs/cover.png \
            --pagesize A4 \
            --fit shrink \
            -o docs/cover_tmp.pdf

      # ── Вставляємо розриви сторінок перед розділами ─────────────────────────
      - name: Inject page breaks before sections
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const lines = fs.readFileSync('docs/HuaweiBook.md', 'utf8').split('\n');
          const out = [];

          for (const line of lines) {
            // Перед кожним ## — розрив, але не перед самим Змістом
            if (/^## /.test(line) && !/^## 📑/.test(line)) {
              out.push('<div class="page-break"></div>', '');
            }
            out.push(line);
          }

          fs.writeFileSync('docs/_processed.md', out.join('\n'));
          console.log('Done: page breaks injected');
          EOF

      # ── Конвертуємо MD → PDF ─────────────────────────────────────────────────
      - name: Convert MD → PDF
        run: |
          md-to-pdf docs/_processed.md \
            --stylesheet docs/pdf-style.css \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' \
            --pdf-options '{"format":"A4","margin":{"top":"20mm","bottom":"20mm","left":"15mm","right":"15mm"}}'

      # ── Зливаємо обкладинку + контент ───────────────────────────────────────
      - name: Merge cover + content
        run: pdfunite docs/cover_tmp.pdf docs/_processed.pdf docs/HuaweiBook.pdf

      # ── Прибираємо тимчасові файли ───────────────────────────────────────────
      - name: Cleanup
        run: rm -f docs/_processed.md docs/_processed.pdf docs/cover_tmp.pdf

      # ── Комітимо результат ───────────────────────────────────────────────────
      - name: Commit HuaweiBook.pdf
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/HuaweiBook.pdf
          git diff --staged --quiet || git commit -m "ci: auto-generate docs/HuaweiBook.pdf [skip ci]"
          git push
