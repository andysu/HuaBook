name: Convert HuaweiBook to PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/HuaweiBook.md'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Install Cyrillic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto

      - name: Convert docs/HuaweiBook.md → docs/HuaweiBook.pdf
        run: |
          md-to-pdf docs/HuaweiBook.md \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' \
            --pdf-options '{"format":"A4","margin":{"top":"20mm","bottom":"20mm","left":"15mm","right":"15mm"}}'

      - name: Commit docs/HuaweiBook.pdf to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/HuaweiBook.pdf
          git diff --staged --quiet || git commit -m "ci: auto-generate docs/HuaweiBook.pdf [skip ci]"
          git push
