name: Build PDF Docs
on: [push]
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install sphinx myst-parser sphinx-rtd-theme rinohtype
          rinoh --version
      - name: Build PDF with rinohtype
        run: |
          cd docs
          sphinx-build -b rinoh . _build/rinoh
          ls -la _build/rinoh/
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: huawei-book-pdf
          path: docs/_build/latex/huabook.pdf
